name: Otomatik APK Olustur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Cek
      uses: actions/checkout@v4

    - name: Zip Dosyasini Cikart
      run: unzip -q uygulama.zip -d proje_klasoru

    - name: Java JDK Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: APK Derle
      run: |
        GRADLE_DIR=$(find proje_klasoru -name "gradlew" -exec dirname {} \; | head -n 1)
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: APK Dosyasini Paketle
      uses: actions/upload-artifact@v4
      with:
        name: Uygulama-APK
        path: proje_klasoru/**/build/outputs/apk/debug/*.apk
